    <title>Flexbox Layout for a Card Component</title>
    <link rel="stylesheet" href="/styles.css" />

    <div class="card">
      <div class="card-info">
        <div class="imgdiv">
          <img
            src="https://picsum.photos/id/237/200/300"
            alt="cute little puppy"
          />
        </div>
        <div class="content">
          <h2>Title</h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Vero
            laboriosam magnam, in corporis, officiis assumenda ullam veritatis
            amet aspernatur consequatur officia at, provident neque similique
            voluptatibus autem! Aliquid, sunt quas!
          </p>
        </div>
      </div>
      <div class="btndiv">
        <button>Learn More</button>
      </div>
    </div>
  </body>
</html>
